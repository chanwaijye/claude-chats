[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-chats"
version = "0.3.0"
description = "Console tool to preview Claude Code chats, flag useless ones by size, and delete them safely"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["windows-curses>=2.3; sys_platform == 'win32'"]
classifiers = ["Environment :: Console :: Curses", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/chanwaijye/claude-chats"

[project.scripts]
claude-chats = "claude_chats.cli:main"
cchats = "claude_chats.cli:main"
